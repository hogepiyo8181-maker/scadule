<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>スケジュール</title>
<meta name="description" content="色分け・給料計算・まとめて登録ができるカレンダー">
<meta name="theme-color" content="#17675C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="スケジュール">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: one screen at a time, like a phone app. The month calendar fills its screen; entering an event, a day's list, pay and colors each get their own screen. */
:root{
  --bg:#F3F5F4; --surface:#FFFFFF; --ink:#1C2826; --muted:#5C6B68; --line:#D9E0DE;
  --accent:#17675C; --accent-ink:#FFFFFF; --accent-soft:#DDEFEA;
  --sun:#C2362F; --sat:#2B5FAE; --today:#17675C;
  --sel:#FFF3C4; --sel-line:#D6A600; --danger:#B3261E;
  --f-display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141A19; --surface:#1D2523; --ink:#E8EEEC; --muted:#9AA9A5; --line:#33403D;
  --accent:#4CC2AE; --accent-ink:#0E1A18; --accent-soft:#1E3A35;
  --sun:#F07A72; --sat:#7EA6F0; --today:#4CC2AE;
  --sel:#4A3F12; --sel-line:#E8C23A; --danger:#F2B8B5;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#141A19; --surface:#1D2523; --ink:#E8EEEC; --muted:#9AA9A5; --line:#33403D;
  --accent:#4CC2AE; --accent-ink:#0E1A18; --accent-soft:#1E3A35;
  --sun:#F07A72; --sat:#7EA6F0; --today:#4CC2AE;
  --sel:#4A3F12; --sel-line:#E8C23A; --danger:#F2B8B5;
  color-scheme:dark;
}
html{-webkit-text-size-adjust:100%}
html[data-fs="l"]{font-size:112.5%}
html[data-fs="xl"]{font-size:125%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:820px;margin:0 auto;display:grid;gap:14px}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.3}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sel-line);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-size:1.35rem}
.proto{font-size:.78rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 10px}
.tabs{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px;width:100%}
.tabs button{flex:1;border:0;background:none;padding:8px 10px;border-radius:999px;font-weight:700;white-space:nowrap}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
@media (min-width:640px){.tabs{width:auto}.tabs button{flex:none;padding:8px 18px}}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;font-weight:700;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger);border-color:var(--danger);background:none}
.btn.ghost{border-color:transparent;background:none;padding-inline:4px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.small{border:1px solid var(--line);background:none;border-radius:8px;padding:4px 10px;font-size:.85rem;color:var(--muted);min-height:36px}
.icon-btn{border:1px solid var(--line);background:var(--surface);width:44px;height:44px;border-radius:50%;font-size:1.2rem;display:grid;place-items:center;flex:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;min-width:0}
.hint,.note{font-size:.85rem;color:var(--muted);margin:0}
.lbl{font-size:.9rem;font-weight:700}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dot{width:12px;height:12px;border-radius:50%;flex:none;background:var(--cc)}

.mhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mhead .nav{display:flex;align-items:center;gap:6px;min-width:0}
.mhead h2{font-size:clamp(1.2rem,5.4vw,1.6rem);white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.mhead .btn{white-space:nowrap;flex:none}

.cal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.dow,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.dow div{text-align:center;font-size:.85rem;font-weight:700;padding:6px 0;color:var(--muted);border-bottom:1px solid var(--line)}
.dow div:first-child{color:var(--sun)} .dow div:last-child{color:var(--sat)}
.day{border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface);min-height:104px;padding:4px 3px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.day:nth-child(7n){border-right:0}
.day.out{background:var(--bg);color:var(--muted)}
.day.out .dnum{opacity:.55}
.dnum{font-weight:700;font-size:.95rem;line-height:1;display:inline-grid;place-items:center;width:1.65rem;height:1.65rem;border-radius:50%;align-self:center}
.day.sun .dnum,.day.hol .dnum{color:var(--sun)} .day.sat .dnum{color:var(--sat)}
.day.today .dnum{background:var(--today);color:var(--accent-ink)}
.hname{font-size:.66rem;color:var(--sun);line-height:1.2;text-align:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.chip{display:block;font-size:.72rem;line-height:1.3;padding:1px 4px;border-radius:4px;background:var(--cs);border-left:3px solid var(--cc);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--ink)}
.chip.full{background:var(--cc);color:#fff;border-left:0}
.chip.task{background:none;border:1px solid var(--cc)}
.chip.done{opacity:.55;text-decoration:line-through}
.chip .tt{font-variant-numeric:tabular-nums}
.more{font-size:.68rem;color:var(--muted);text-align:center}
@media (max-width:560px){
  .cal{margin-inline:-16px;border-radius:0;border-left:0;border-right:0}
  .day{min-height:88px;padding:3px 1px}
  .chip{font-size:.72rem;padding:0 2px;letter-spacing:-.03em}
}
.trow{flex-wrap:nowrap}
.trow input{flex:1;min-width:0}
.seg.modes{padding:3px;border-radius:10px;gap:2px}
.seg.modes button{padding:4px;min-height:34px;font-size:.9rem;border-radius:8px}
.grid .day{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.day.drop{box-shadow:inset 0 0 0 3px var(--accent);background:var(--accent-soft)}
.chip.moving{opacity:.35}
.chip.full.cont-l{border-top-left-radius:0;border-bottom-left-radius:0;margin-left:-3px}
.chip.full.cont-r{border-top-right-radius:0;border-bottom-right-radius:0;margin-right:-3px}
button.chip{font:inherit;font-size:.72rem;text-align:left;width:100%;cursor:pointer;display:block}
.drag-ghost{position:fixed;z-index:30;pointer-events:none;transform:translate(-50%,-120%);background:var(--cc);color:#fff;border-radius:8px;padding:6px 10px;font-weight:700;font-size:.85rem;box-shadow:0 6px 18px rgba(0,0,0,.25);max-width:60vw;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tl-head,.tl-all,.tl-grid{display:grid}
.tl-head{border-bottom:1px solid var(--line)}
.tl-dh{border:0;background:none;display:grid;justify-items:center;padding:6px 0;font-size:.78rem;color:var(--muted)}
.tl-dh b{font-size:1rem;color:var(--ink);width:28px;height:28px;display:grid;place-items:center;border-radius:50%;font-variant-numeric:tabular-nums}
.tl-dh.sun,.tl-dh.sun b{color:var(--sun)} .tl-dh.sat,.tl-dh.sat b{color:var(--sat)}
.tl-dh b.is-today{background:var(--today);color:var(--accent-ink)}
.tl-all{border-bottom:1px solid var(--line);align-items:start}
.tl-lbl{font-size:.68rem;color:var(--muted);text-align:center;padding-top:5px}
.tl-ac{display:grid;gap:2px;padding:3px 2px;min-width:0;border-left:1px solid var(--line)}
.tl-body{max-height:max(360px,calc(100vh - 300px));overflow-y:auto;position:relative;overscroll-behavior:contain}
.tl-grid{position:relative}
.tl-gut{position:relative}
.tl-h{position:absolute;right:6px;transform:translateY(-50%);font-size:.66rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tl-col{position:relative;border-left:1px solid var(--line);cursor:pointer;background-image:repeating-linear-gradient(to bottom,var(--line) 0,var(--line) 1px,transparent 1px,transparent 44px)}
.tl-ev{position:absolute;border:0;border-left:3px solid var(--cc);background:var(--cs);border-radius:4px;padding:1px 3px;text-align:left;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-start;font-size:.68rem;line-height:1.25;color:var(--ink);font-family:inherit}
.tl-ev>*{flex:none}
.tl-ev b{overflow:hidden;word-break:break-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tl-ev span{display:block;font-variant-numeric:tabular-nums;opacity:.8;white-space:nowrap}
.tl-ev.short b{-webkit-line-clamp:1}
.tl-ev.short span{display:none}
.tl-ev.task{background:var(--surface);border:1px solid var(--cc)}
.tl-ev.done{opacity:.55;text-decoration:line-through}
.tl-now{position:absolute;left:0;right:0;height:2px;background:var(--sun);pointer-events:none}
.tl-now::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--sun)}
.lday{display:grid;gap:8px}
.lday-h{font-size:1rem}
.link{border:0;background:none;padding:0;font:inherit;font-weight:700;color:inherit;cursor:pointer;text-align:left}
.lday-h.is-today .link{color:var(--accent)}
.item .body{flex:1;min-width:0;display:grid}
.map{display:block;padding:0 12px 10px;font-size:.88rem;color:var(--accent);overflow-wrap:anywhere}
.toast-undo{margin-left:14px;border:0;background:none;color:inherit;font-weight:700;text-decoration:underline;padding:4px;min-height:32px;cursor:pointer}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:10px 12px;font-size:.85rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}

.fab{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:15;height:60px;padding:0 22px 0 18px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:1rem;display:flex;align-items:center;gap:8px;box-shadow:0 6px 18px rgba(0,0,0,.22)}
.fab b{font-size:1.8rem;line-height:1;font-weight:500}

.sbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:12;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:6px}
.sbar h2{font-size:1.15rem;text-align:center;flex:1;min-width:0}

.items{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.item{display:flex;align-items:stretch;gap:4px;border:1px solid var(--line);border-left:6px solid var(--cc);border-radius:10px;background:var(--surface)}
.item .open{flex:1;min-width:0;border:0;background:none;text-align:left;padding:10px 12px;display:grid;gap:2px}
.item .t1{font-weight:700;overflow-wrap:anywhere}
.item .t2{font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
.item .t3{font-size:.88rem;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);border-radius:6px;padding:4px 8px;margin-top:4px}
.chip .memo{opacity:.75;margin-left:1px}
.item.done .t1{text-decoration:line-through;color:var(--muted)}
.check-btn{border:0;background:none;padding:0 0 0 12px;display:grid;place-items:center}
.check-btn span{width:26px;height:26px;border-radius:50%;border:2px solid var(--cc);display:grid;place-items:center;font-weight:700;color:#fff}
.check-btn[aria-pressed="true"] span{background:var(--cc)}
.kind{font-size:.72rem;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:0 8px;color:var(--muted);margin-right:6px}
.empty{color:var(--muted);margin:0;padding:16px;border:1px dashed var(--line);border-radius:10px;text-align:center}

.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:10px;font-weight:700;min-height:44px}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.title-in{width:100%;border:0;border-bottom:2px solid var(--line);background:none;font-family:var(--f-display);font-size:1.4rem;font-weight:700;padding:8px 2px;border-radius:0}
.title-in:focus{border-bottom-color:var(--accent);outline:none}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:700;cursor:pointer}
.switch{position:relative;width:52px;height:30px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;cursor:pointer;margin:0;z-index:1}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .15s}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{transform:translateX(22px)}
.switch input:focus-visible+span{outline:3px solid var(--sel-line);outline-offset:2px}
input[type=time],input[type=date],input[type=number],input[type=text],input[type=search],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-height:44px;min-width:0}
input[type=number]{width:7em}
textarea{width:100%;min-height:140px;line-height:1.7;font-variant-numeric:tabular-nums}
.mini{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;touch-action:none;user-select:none;-webkit-user-select:none}
.mini .w{text-align:center;font-size:.78rem;font-weight:700;color:var(--muted)}
.mini .w:first-child{color:var(--sun)} .mini .w:nth-child(7){color:var(--sat)}
.mday{border:1px solid var(--line);background:var(--surface);border-radius:8px;height:44px;font-weight:700;font-variant-numeric:tabular-nums;display:grid;place-items:center;position:relative;padding:0}
.mday.sun,.mday.hol{color:var(--sun)} .mday.sat{color:var(--sat)}
.mday[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.mday.has::after{content:"";position:absolute;bottom:5px;width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.6}
.wkrow{display:flex;gap:6px;flex-wrap:wrap}
.wkrow button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-weight:700;padding:0}
.picked{font-size:.95rem;margin:0;font-variant-numeric:tabular-nums}
.cats{display:flex;flex-wrap:wrap;gap:8px}
.cat-btn{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;min-height:44px;font-weight:500}
.cat-btn[aria-pressed="true"]{border-color:var(--cc);background:var(--cs);font-weight:700}
.sw{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw button{width:34px;height:34px;border-radius:50%;border:3px solid var(--surface);background:var(--cc);box-shadow:0 0 0 1px var(--line);padding:0}
.sw button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.sw .def{width:auto;border-radius:999px;padding:0 12px;background:var(--surface);font-size:.85rem;font-weight:700;height:34px}
.custom{position:relative;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#D50000,#F6BF26,#33B679,#039BE5,#8E24AA,#D50000);box-shadow:0 0 0 1px var(--line);cursor:pointer}
.custom span{width:22px;height:22px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-weight:700;font-size:.9rem}
.custom.on{box-shadow:0 0 0 3px var(--ink)}
.custom.on span{background:var(--cc);color:#fff}
.custom input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.custom:has(input:focus-visible){outline:3px solid var(--sel-line);outline-offset:2px}
details.card>summary{cursor:pointer;font-weight:700}
.more-box{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.more-box>summary{cursor:pointer;font-weight:700;color:var(--muted)}
.imp{display:grid;gap:10px;margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.imp p{margin:0}
.imp-row{display:grid;gap:4px}
.imp select{width:100%}
.imp .isel{flex-wrap:nowrap;gap:8px}
.imp .isel select{flex:1;min-width:0}
.imp-titles>summary{cursor:pointer;font-weight:700}
.tlist{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:12px}
.tlist li{display:grid;gap:4px}
.tname-row{display:flex;justify-content:space-between;gap:8px}
.tname{font-weight:700;overflow-wrap:anywhere}
.tcount{color:var(--muted);flex:none}
.preview{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.preview li{border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:.85rem;font-variant-numeric:tabular-nums}

.sum-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:640px){.sum-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.sum-item{display:grid;gap:2px}
.sum-item .l{font-size:.82rem;color:var(--muted)}
.sum-item .v{font-family:var(--f-display);font-weight:700;font-size:1.35rem;font-variant-numeric:tabular-nums}
.sum-item.total .v{color:var(--accent)}
.shift{border:1px solid var(--line);border-left:6px solid var(--cc);border-radius:10px;padding:10px 12px;display:grid;gap:4px}
.shift-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.shift .amt{font-family:var(--f-display);font-weight:700;font-size:1.1rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.shift .det{font-size:.85rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 12px;font-variant-numeric:tabular-nums}
.wp{border-top:6px solid var(--cc)}
.wp-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.opt{border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;gap:8px;align-content:start}
.opt h4{font-size:1rem}
.check{display:flex;align-items:center;gap:8px;font-weight:500}
.check input{width:22px;height:22px;accent-color:var(--accent);flex:none}

.crow{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:10px;background:var(--surface)}
.crow-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.big-dot{width:28px;height:28px;border-radius:50%;background:var(--cc);flex:none}
.crow-top input[type=text]{flex:1 1 160px;font-weight:700}
.sw-name{font-size:.85rem;color:var(--muted)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;font-weight:700;z-index:20;width:max-content;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:reduce){.switch span,.switch span::after{transition:none}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top" id="top">
    <div class="brand"><h1>スケジュール</h1></div>
    <nav class="tabs" aria-label="画面の切り替え">
      <button type="button" id="tab-cal" data-view="cal" aria-pressed="true">カレンダー</button>
      <button type="button" id="tab-pay" data-view="pay" aria-pressed="false">給料</button>
      <button type="button" id="tab-set" data-view="colors" aria-pressed="false">色と種類</button>
    </nav>
  </header>
  <main id="view"></main>
</div>
<button type="button" class="fab" id="fab" data-act="new" aria-label="予定を入れる"><b aria-hidden="true">＋</b>予定を入れる</button>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function(){
const COLORS=[{n:"トマト",h:"#D50000"},{n:"フラミンゴ",h:"#E67C73"},{n:"ミカン",h:"#F4511E"},{n:"バナナ",h:"#F6BF26"},{n:"セージ",h:"#33B679"},{n:"バジル",h:"#0B8043"},{n:"ピーコック",h:"#039BE5"},{n:"ブルーベリー",h:"#3F51B5"},{n:"ラベンダー",h:"#7986CB"},{n:"グレープ",h:"#8E24AA"},{n:"グラファイト",h:"#616161"}];
const GRAY="#616161";
const colorName=h=>{const c=COLORS.find(c=>c.h.toLowerCase()===String(h).toLowerCase());return c?c.n:"自分で選んだ色"};
const WD=["日","月","火","水","木","金","土"];
const _hol={};
function holidaysOf(y){
  if(_hol[y]) return _hol[y];
  const h={}; const set=(m,d,n)=>{h[ds(y,m-1,d)]=n};
  const nthMon=(m,n)=>{const f=new Date(y,m-1,1).getDay();return 1+((8-f)%7)+(n-1)*7;};
  set(1,1,"元日"); set(1,nthMon(1,2),"成人の日"); set(2,11,"建国記念の日"); set(2,23,"天皇誕生日");
  set(3,Math.floor(20.8431+0.242194*(y-1980)-Math.floor((y-1980)/4)),"春分の日");
  set(4,29,"昭和の日"); set(5,3,"憲法記念日"); set(5,4,"みどりの日"); set(5,5,"こどもの日");
  set(7,nthMon(7,3),"海の日"); set(8,11,"山の日"); set(9,nthMon(9,3),"敬老の日");
  set(9,Math.floor(23.2488+0.242194*(y-1980)-Math.floor((y-1980)/4)),"秋分の日");
  set(10,nthMon(10,2),"スポーツの日"); set(11,3,"文化の日"); set(11,23,"勤労感謝の日");
  // 国民の休日（祝日にはさまれた日）
  Object.keys(h).forEach(k=>{const d=new Date(k+"T00:00");d.setDate(d.getDate()+2);const k2=ds(d.getFullYear(),d.getMonth(),d.getDate());
    if(h[k2]){d.setDate(d.getDate()-1);const k1=ds(d.getFullYear(),d.getMonth(),d.getDate());if(!h[k1]&&d.getDay()!==0) h[k1]="国民の休日";}});
  // 振替休日
  Object.keys(h).sort().forEach(k=>{const d=new Date(k+"T00:00");if(d.getDay()!==0) return;
    do{d.setDate(d.getDate()+1);}while(h[ds(d.getFullYear(),d.getMonth(),d.getDate())]);
    h[ds(d.getFullYear(),d.getMonth(),d.getDate())]="振替休日";});
  return _hol[y]=h;
}
const holiday=k=>holidaysOf(+k.slice(0,4))[k];
const _t=new Date(); let TODAY=`${_t.getFullYear()}-${String(_t.getMonth()+1).padStart(2,"0")}-${String(_t.getDate()).padStart(2,"0")}`;
const WAGE_DEFAULT={wage:1100,unit:15,dir:"floor",weekendPlus:0,earlyPlus:0,nightOn:true,nightPct:25,nightStart:"22:00",nightEnd:"05:00",otOn:true,otPct:25,autoBreak:true,holOn:false,holWage:1200,travel:"none",travelAmt:0};
const defaultBreaks=()=>[{over:6,min:45},{over:8,min:60}];
const wageDefaults=()=>Object.assign({},WAGE_DEFAULT,{breaks:defaultBreaks(),raises:[]});

let uid=100; const nid=()=>"e"+(uid++);
const state={
  view:"cal", back:"cal", calMode:"month", fs:"m", q:"", listMore:1, tlScroll:null, year:_t.getFullYear(), month:_t.getMonth(), sel:TODAY, showTake:true, draft:null,
  cats:[
    Object.assign({id:"c0",name:"バイト",color:"#F4511E",pay:true},wageDefaults(),{holOn:true}),
    {id:"c1",name:"遊び・プライベート",color:"#33B679",pay:false},
    {id:"c2",name:"大事な予定",color:"#D50000",pay:false},
    {id:"c3",name:"やること",color:"#3F51B5",pay:false}
  ],
  events:[]
};
const STORE="irodori-shift-v1";
function load(){
  try{const raw=localStorage.getItem(STORE); if(!raw) return false; const o=JSON.parse(raw);
    if(Array.isArray(o.cats)&&o.cats.length) state.cats=o.cats; if(Array.isArray(o.events)) state.events=o.events;
    if(typeof o.showTake==="boolean") state.showTake=o.showTake; if(o.uid) uid=o.uid; if(o.calMode) state.calMode=o.calMode; if(o.fs) state.fs=o.fs; return true;}catch(e){return false;}
}
let saveOK=true;
function save(){
  try{localStorage.setItem(STORE,JSON.stringify({v:1,cats:state.cats,events:state.events,showTake:state.showTake,uid,calMode:state.calMode,fs:state.fs}));saveOK=true;}
  catch(e){if(saveOK) setTimeout(()=>toast("この端末に保存できませんでした。ブラウザの設定を確認してください"),0); saveOK=false;}
}
const firstRun=!load();

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const yen=n=>"¥"+Math.round(n).toLocaleString("ja-JP");
const pad=n=>String(n).padStart(2,"0");
const ds=(y,m,d)=>`${y}-${pad(m+1)}-${pad(d)}`;
const toMin=t=>{const[h,m]=t.split(":").map(Number);return h*60+m};
const ov=(a,b,c,d)=>Math.max(0,Math.min(b,d)-Math.max(a,c));
const catOf=id=>state.cats.find(c=>c.id===id);
const colorOf=e=>e.color||(catOf(e.cat)||{color:GRAY}).color;
const cv=h=>`--cc:${h};--cs:color-mix(in srgb, ${h} 22%, var(--surface))`;
const st=t=>{const h=+t.slice(0,2),m=t.slice(3);return m==="00"?String(h):h+":"+m};
const hm=m=>`${Math.floor(m/60)}時間${m%60?(m%60)+"分":""}`;
const md=k=>{const d=new Date(k+"T00:00");return `${d.getMonth()+1}/${d.getDate()}`};
const jdate=k=>{const d=new Date(k+"T00:00");return `${d.getMonth()+1}月${d.getDate()}日（${WD[d.getDay()]}）`};
const isPayShift=e=>e.type==="event"&&!e.allDay&&catOf(e.cat)&&catOf(e.cat).pay;
const sortItems=(a,b)=>(a.allDay===b.allDay?0:a.allDay?-1:1)||(a.allDay?0:a.start.localeCompare(b.start))||(a.type===b.type?0:a.type==="event"?-1:1);
const addDays=(k,n)=>{const d=new Date(k+"T00:00");d.setDate(d.getDate()+n);return ds(d.getFullYear(),d.getMonth(),d.getDate());};
const diffDays=(a,b)=>Math.round((new Date(b+"T00:00")-new Date(a+"T00:00"))/864e5);
const isRep=e=>!!(e&&e.repeat&&e.repeat.freq);
const spanOf=e=>e.allDay&&e.endDate&&e.endDate>e.date?diffDays(e.date,e.endDate):0;
// その日に始まる回があるか（繰り返し・例外の日を考える）
function startsOn(e,c){
  if(c<e.date) return false;
  if(!isRep(e)) return c===e.date;
  const r=e.repeat; if(r.until&&c>r.until) return false; if((e.skip||[]).includes(c)) return false;
  const a=new Date(e.date+"T00:00"), b=new Date(c+"T00:00"), iv=Math.max(1,+r.interval||1);
  switch(r.freq){
    case "day": return diffDays(e.date,c)%iv===0;
    case "week": return diffDays(e.date,c)%(7*iv)===0;
    case "month": return a.getDate()===b.getDate()&&((b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth())%iv===0;
    case "year": return a.getDate()===b.getDate()&&a.getMonth()===b.getMonth()&&(b.getFullYear()-a.getFullYear())%iv===0;
  }
  return false;
}
// ある日に表示する予定（繰り返し・何日も続く予定を1日ずつに広げる）
function occurrencesOn(k){
  const out=[];
  for(const e of state.events){
    if(e.date>k) continue;
    const L=spanOf(e);
    if(!isRep(e)&&!L){ if(e.date===k) out.push(mkOcc(e,k,0,0)); continue; }
    for(let off=0;off<=L;off++){ const c=off?addDays(k,-off):k; if(startsOn(e,c)){ out.push(mkOcc(e,c,off,L)); break; } }
  }
  return out.sort(sortItems);
}
const mkOcc=(e,c,off,L)=>Object.assign({},e,{occ:c,date:c,endDate:L?addDays(c,L):"",first:off===0,last:off===L,multi:L>0,done:isRep(e)?(e.doneOn||[]).includes(c):!!e.done});
function repeatLabel(e){
  if(!isRep(e)) return ""; const d=new Date(e.date+"T00:00"); const r=e.repeat;
  const iv=Math.max(1,+r.interval||1);
  const base=iv>1?(r.freq==="day"?`${iv}日ごと`:r.freq==="week"?`${iv}週間ごとの${WD[d.getDay()]}曜日`:r.freq==="month"?`${iv}か月ごとの${d.getDate()}日`:`${iv}年ごとの${d.getMonth()+1}月${d.getDate()}日`)
    :r.freq==="day"?"毎日":r.freq==="week"?`毎週${WD[d.getDay()]}曜日`:r.freq==="month"?`毎月${d.getDate()}日`:`毎年${d.getMonth()+1}月${d.getDate()}日`;
  return base+(r.until?`（${md(r.until)}まで）`:"");
}
const timeLabel=e=>e.multi||spanOf(e)?`${md(e.date)}〜${md(e.endDate)}（終日）`:e.allDay?"終日":e.type==="task"?`${e.start}まで`:`${e.start}〜${e.end}`;
const monthShifts=()=>{const y=state.year,m=state.month,dim=new Date(y,m+1,0).getDate(),out=[];for(let x=1;x<=dim;x++) occurrencesOn(ds(y,m,x)).filter(isPayShift).forEach(o=>out.push(o));return out.sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));};

function specialDay(date){
  const m=date.slice(5);
  if(holiday(date)) return holiday(date);
  if(m==="12-31"||m==="01-01"||m==="01-02"||m==="01-03") return "年末年始";
  return null;
}
function wageOn(wp,date){
  let w=+wp.wage||0, from=null;
  (wp.raises||[]).filter(r=>r.from&&r.from<=date).sort((a,b)=>a.from.localeCompare(b.from)).forEach(r=>{w=+r.wage||0;from=r.from;});
  return {w,from};
}
function shiftPay(ev,wp){
  let s=toMin(ev.start), e=toMin(ev.end); if(e<=s) e+=1440;
  const span=e-s;
  // 休憩：「○時間を超えたら○分」のうち、当てはまる中でいちばん長い時間のルールを使う
  const rules=(wp.breaks||defaultBreaks()).filter(r=>span>(+r.over||0)*60).sort((a,b)=>(+b.over)-(+a.over));
  const brk=wp.autoBreak&&rules.length?Math.max(0,+rules[0].min||0):0;
  let worked=Math.max(0,span-brk);
  const u=+wp.unit||1; worked=(wp.dir==="ceil"?Math.ceil(worked/u):Math.floor(worked/u))*u;
  const w=new Date(ev.date+"T00:00").getDay();
  const sp=specialDay(ev.date);
  const eff=wageOn(wp,ev.date); let base=eff.w, why=eff.from?`${md(eff.from)}からの時給`:"";
  if(wp.holOn&&sp){base=+wp.holWage||base;why=sp+"の時給";}
  else if((w===0||w===6)&&+wp.weekendPlus){base+= +wp.weekendPlus;why=(why?why+"・":"")+"土日の上乗せ";}
  // 深夜の時間帯（自分で決めた開始〜終了）。終了が開始より早いときは次の日の朝まで
  const ns=toMin(wp.nightStart||"22:00"); let ne=toMin(wp.nightEnd||"05:00"); if(ne<=ns) ne+=1440;
  let nightRaw=0; for(const d of [-1,0,1]) nightRaw+=ov(s,e,ns+d*1440,ne+d*1440);
  const night=Math.min(worked,nightRaw);
  const early=Math.min(worked,ov(s,e,300,480)+ov(s,e,1740,1920));
  const ot=Math.max(0,worked-480);
  const basePay=worked*base/60;
  const nightPay=wp.nightOn?night*base*(+wp.nightPct||0)/100/60:0;
  const otPay=wp.otOn?ot*base*(+wp.otPct||0)/100/60:0;
  const earlyPay=early*(+wp.earlyPlus||0)/60;
  return {worked,brk,base,why,basePay,nightPay,otPay,earlyPay,pay:Math.floor(basePay+nightPay+otPay+earlyPay)};
}
function monthTotals(){
  const per={}; const wps=state.cats.filter(c=>c.pay);
  wps.forEach(w=>per[w.id]={pay:0,days:new Set(),travel:0});
  monthShifts().forEach(e=>{const r=shiftPay(e,catOf(e.cat));per[e.cat].pay+=r.pay;per[e.cat].days.add(e.date);});
  let pay=0,travel=0;
  wps.forEach(w=>{const p=per[w.id];p.travel=w.travel==="day"?p.days.size*(+w.travelAmt||0):(w.travel==="pass"&&p.days.size?(+w.travelAmt||0):0);pay+=p.pay;travel+=p.travel;});
  const tax=pay<88000?0:Math.floor((pay-88000)*0.0511/10)*10;
  return {per,pay,travel,tax,wps};
}

/* ---------- screens ---------- */
function monthHead(){
  return `<div class="mhead"><div class="nav"><button class="icon-btn" type="button" data-act="prev" aria-label="前の月">‹</button><h2 class="num">${state.year}年${state.month+1}月</h2><button class="icon-btn" type="button" data-act="next" aria-label="次の月">›</button></div><button class="btn" type="button" data-act="today">今日</button></div>`;
}
function chip(o,k){
  const c=cv(colorOf(o)), da=`data-ev="${o.id}" data-occ="${o.occ}"`;
  if(o.type==="task") return `<span class="chip task${o.done?" done":""}" style="${c}" ${da}>${o.done?"✓":"○"}${esc(o.title)}</span>`;
  // 何日も続く予定は、始まりの日と週の初め（日曜）だけ名前を出し、あとは帯だけにする
  const showName=!o.multi||o.first||!k||new Date(k+"T00:00").getDay()===0;
  if(o.allDay) return `<span class="chip full${o.multi&&!o.first?" cont-l":""}${o.multi&&!o.last?" cont-r":""}" style="${c}" ${da}>${showName?esc(o.title):"&nbsp;"}</span>`;
  return `<span class="chip" style="${c}" ${da}><span class="tt">${st(o.start)}-${st(o.end)}</span></span>`;
}
function calHead(mode){
  const k=state.sel, ws=addDays(k,-new Date(k+"T00:00").getDay());
  const title=mode==="month"?`${state.year}年${state.month+1}月`:mode==="week"?`${md(ws)}〜${md(addDays(ws,6))}`:mode==="day"?jdate(k):`${md(k)}から`;
  return `<div class="mhead"><div class="nav"><button class="icon-btn" type="button" data-act="prev" aria-label="前へ">‹</button><h2 class="num">${title}</h2><button class="icon-btn" type="button" data-act="next" aria-label="次へ">›</button></div>
    <div class="row" style="gap:6px;flex-wrap:nowrap"><button class="icon-btn" type="button" data-view="search" aria-label="予定を探す"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M16.5 16.5L21 21" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button><button class="btn" type="button" data-act="today">今日</button></div></div>
  <div class="seg modes" role="group" aria-label="表示のしかた">${[["month","月"],["week","週"],["day","日"],["list","一覧"]].map(([v,l])=>`<button type="button" data-mode="${v}" aria-pressed="${mode===v}">${l}</button>`).join("")}</div>`;
}
function renderCal(){
  const mode=state.calMode||"month";
  let body;
  if(mode==="week"){const ws=addDays(state.sel,-new Date(state.sel+"T00:00").getDay());body=renderTimeline(Array.from({length:7},(_,i)=>addDays(ws,i)));}
  else if(mode==="day") body=renderTimeline([state.sel]);
  else if(mode==="list") body=renderList();
  else body=renderMonth();
  return `<div style="display:grid;gap:12px">${calHead(mode)}${body}</div>`;
}
function renderMonth(){
  const y=state.year,m=state.month;
  const first=new Date(y,m,1).getDay(), dim=new Date(y,m+1,0).getDate();
  const total=Math.ceil((first+dim)/7)*7; const cells=[];
  for(let i=0;i<total;i++){
    const d=new Date(y,m,1-first+i); const k=ds(d.getFullYear(),d.getMonth(),d.getDate());
    const out=d.getMonth()!==m, w=d.getDay(), hol=holiday(k);
    const evs=occurrencesOn(k);
    const cls=["day",out?"out":"",w===0?"sun":"",w===6?"sat":"",hol?"hol":"",k===TODAY?"today":""].join(" ");
    cells.push(`<button type="button" class="${cls}" data-day="${k}" aria-label="${jdate(k)}${hol?" "+hol:""}、${evs.length}件">
      <span class="dnum num">${d.getDate()}</span>${hol&&!out?`<span class="hname">${hol}</span>`:""}
      ${evs.slice(0,3).map(o=>chip(o,k)).join("")}${evs.length>3?`<span class="more">+${evs.length-3}</span>`:""}</button>`);
  }
  return `<section class="cal" aria-label="月のカレンダー">
    <div class="dow">${WD.map(w=>`<div>${w}</div>`).join("")}</div>
    <div class="grid">${cells.join("")}</div>
    <div class="legend">${state.cats.map(c=>`<span style="${cv(c.color)}"><i class="dot"></i>${esc(c.name||"名前なし")}</span>`).join("")}<button type="button" class="small" data-view="colors">色を変える</button></div>
  </section>
  <p class="hint">日付をタップするとその日の予定が見られます。予定を長押しすると別の日に移せます。${state.events.length?"":"<br>はじめに「色と種類」で色の意味を、「給料」で時給を決めておくと便利です。"}</p>`;
}
const HOUR=44;
function segsFor(k){
  const segs=[];
  occurrencesOn(k).filter(o=>!o.allDay).forEach(o=>{const s=toMin(o.start);let e=o.type==="task"?s+30:toMin(o.end);if(o.type!=="task"&&e<=s)e=1440;segs.push({o,s,e:Math.min(e,1440)});});
  occurrencesOn(addDays(k,-1)).filter(o=>!o.allDay&&o.type==="event"&&toMin(o.end)<=toMin(o.start)&&toMin(o.end)>0).forEach(o=>segs.push({o,s:0,e:toMin(o.end),cont:true}));
  segs.sort((a,b)=>a.s-b.s||b.e-a.e);
  const lanes=[]; segs.forEach(g=>{let i=lanes.findIndex(end=>end<=g.s);if(i<0){i=lanes.length;lanes.push(0);}lanes[i]=g.e;g.lane=i;});
  segs.forEach(g=>g.n=lanes.length); return segs;
}
function renderTimeline(days){
  const cols=`44px repeat(${days.length},minmax(0,1fr))`;
  const head=`<div class="tl-head" style="grid-template-columns:${cols}"><span></span>${days.map(k=>{const d=new Date(k+"T00:00"),w=d.getDay();return `<button type="button" class="tl-dh${w===0||holiday(k)?" sun":""}${w===6&&!holiday(k)?" sat":""}" data-gotoday="${k}" aria-label="${jdate(k)}の予定を見る"><span>${WD[w]}</span><b class="${k===TODAY?"is-today":""}">${d.getDate()}</b></button>`}).join("")}</div>`;
  const all=days.map(k=>occurrencesOn(k).filter(o=>o.allDay));
  const adRow=all.some(a=>a.length)?`<div class="tl-all" style="grid-template-columns:${cols}"><span class="tl-lbl">終日</span>${all.map(list=>`<div class="tl-ac">${list.map(o=>`<button type="button" class="chip ${o.type==="task"?"task":"full"}${o.done?" done":""}" style="${cv(colorOf(o))}" data-open="${o.id}" data-occ="${o.occ}">${o.type==="task"?(o.done?"✓":"○"):""}${esc(o.title)}</button>`).join("")}</div>`).join("")}</div>`:"";
  const hours=Array.from({length:24},(_,h)=>`<span class="tl-h" style="top:${h*HOUR}px">${h?h+":00":""}</span>`).join("");
  const now=new Date(), nowMin=now.getHours()*60+now.getMinutes();
  const colsHtml=days.map(k=>`<div class="tl-col" data-slot="${k}">${segsFor(k).map(g=>`<button type="button" class="tl-ev${g.o.type==="task"?" task":""}${g.o.done?" done":""}${(g.e-g.s)<50?" short":""}" style="${cv(colorOf(g.o))};top:${g.s/60*HOUR}px;height:${Math.max(20,(g.e-g.s)/60*HOUR-2)}px;left:calc(${g.lane/g.n*100}% + 1px);width:calc(${100/g.n}% - 2px)" data-open="${g.o.id}" data-occ="${g.o.occ}"><b>${g.o.type==="task"?(g.o.done?"✓":"○"):""}${esc(g.o.title)}</b><span>${g.cont?"〜"+st(g.o.end):st(g.o.start)+(g.o.type==="task"?"":"-"+st(g.o.end))}</span></button>`).join("")}${k===TODAY?`<i class="tl-now" style="top:${nowMin/60*HOUR}px"></i>`:""}</div>`).join("");
  return `<section class="cal" aria-label="時間ごとの予定">${head}${adRow}<div class="tl-body" id="tl-body"><div class="tl-grid" style="grid-template-columns:${cols};height:${24*HOUR}px"><div class="tl-gut">${hours}</div>${colsHtml}</div></div></section>
  <p class="hint">空いている時間をタップすると、その時間から予定を入れられます。上の日付をタップすると、その日だけの表示になります。</p>`;
}
function renderList(){
  const days=60*(state.listMore||1); let html="";
  for(let i=0;i<days;i++){
    const k=addDays(state.sel,i), occ=occurrencesOn(k); if(!occ.length) continue;
    html+=`<section class="lday"><h3 class="lday-h${k===TODAY?" is-today":""}"><button type="button" class="link" data-day="${k}">${jdate(k)}${k===TODAY?"・今日":""}${holiday(k)?"・"+holiday(k):""}</button></h3><ul class="items">${occ.map(o=>itemHtml(o)).join("")}</ul></section>`;
  }
  return `<div style="display:grid;gap:16px">${html||`<p class="empty">${md(state.sel)}から${days}日の間に予定はありません</p>`}<button type="button" class="btn" data-act="listmore">もっと先まで見る</button></div>`;
}
function itemHtml(o,opts){
  opts=opts||{}; const c=catOf(o.cat)||{name:"不明"};
  const when=opts.withDate?(isRep(o)?`${md(o.date)}から・`:(o.multi||spanOf(o)?"":`${jdate(o.date)}・`)):"";
  return `<li class="item${o.done?" done":""}" style="${cv(colorOf(o))}">
    ${o.type==="task"&&!opts.noCheck?`<button type="button" class="check-btn" data-done="${o.id}" data-occ="${o.occ}" aria-pressed="${o.done}" aria-label="${o.done?"終わったのを取り消す":"終わった"}"><span>${o.done?"✓":""}</span></button>`:""}
    <div class="body"><button type="button" class="open" data-open="${o.id}" data-occ="${o.occ}"><span class="t1">${esc(o.title)}</span><span class="t2"><span class="kind">${o.type==="task"?"タスク":"予定"}</span>${when}${timeLabel(o)}・${esc(c.name)}${isRep(o)?`・${repeatLabel(o)}`:""}</span>${o.memo?`<span class="t3">${esc(o.memo)}</span>`:""}</button>
    ${o.place?`<a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=${encodeURIComponent(o.place)}" target="_blank" rel="noopener">場所：${esc(o.place)}（地図で開く）</a>`:""}</div></li>`;
}
function renderSearch(){
  return `<div style="display:grid;gap:12px">
  <div class="sbar"><button class="btn ghost" type="button" data-view="cal">‹ 戻る</button><h2>予定を探す</h2><span style="width:44px"></span></div>
  <input type="search" id="q" value="${esc(state.q||"")}" placeholder="タイトル・メモ・場所・種類で探す" aria-label="探す言葉" style="width:100%">
  <div id="results">${searchResults()}</div></div>`;
}
function searchResults(){
  const q=(state.q||"").trim().toLowerCase();
  if(!q) return `<p class="hint">言葉を入れると、合う予定が出ます。</p>`;
  const hits=state.events.filter(e=>[e.title,e.memo,e.place,(catOf(e.cat)||{}).name].some(x=>x&&String(x).toLowerCase().includes(q))).sort((a,b)=>a.date.localeCompare(b.date));
  if(!hits.length) return `<p class="empty">「${esc(q)}」に合う予定はありません</p>`;
  return `<p class="hint">${hits.length}件</p><ul class="items">${hits.slice(0,200).map(e=>itemHtml(mkOcc(e,e.date,0,spanOf(e)),{withDate:true,noCheck:true})).join("")}</ul>`;
}
function renderDay(){
  const k=state.sel; const sp=specialDay(k);
  const evs=occurrencesOn(k);
  return `<div style="display:grid;gap:12px">
  <div class="sbar"><button class="btn ghost" type="button" data-view="cal">‹ 戻る</button><h2 class="num">${jdate(k)}</h2><span class="row" style="gap:4px;flex-wrap:nowrap"><button class="icon-btn" type="button" data-act="dprev" aria-label="前の日">‹</button><button class="icon-btn" type="button" data-act="dnext" aria-label="次の日">›</button></span></div>
  ${sp?`<p class="hint" style="color:var(--sun)">${sp}</p>`:""}
  ${evs.length?`<ul class="items">${evs.map(o=>itemHtml(o)).join("")}</ul>`:`<p class="empty">この日の予定はまだありません</p>`}
  <p class="hint">予定をタップすると直したり消したりできます。</p>
  <button type="button" class="btn primary" data-act="new">＋ この日に予定を入れる</button></div>`;
}
function catButtons(cur){
  return `<div class="cats" role="group" aria-label="種類">${state.cats.map(c=>`<button type="button" class="cat-btn" style="${cv(c.color)}" data-dcat="${c.id}" aria-pressed="${c.id===cur}"><i class="dot"></i>${esc(c.name||"名前なし")}</button>`).join("")}</div>`;
}
function miniCal(d){
  const y=d.my,m=d.mm; const first=new Date(y,m,1).getDay(), dim=new Date(y,m+1,0).getDate();
  let h=WD.map(w=>`<span class="w">${w}</span>`).join("");
  for(let i=0;i<first;i++) h+=`<span></span>`;
  for(let x=1;x<=dim;x++){const k=ds(y,m,x),w=new Date(y,m,x).getDay();const has=occurrencesOn(k).length>0;
    h+=`<button type="button" class="mday${w===0?" sun":""}${w===6?" sat":""}${holiday(k)?" hol":""}${has?" has":""}" data-mdate="${k}" aria-pressed="${d.dates.has(k)}" aria-label="${jdate(k)}">${x}</button>`;}
  return h;
}
function renderEdit(){
  const d=state.draft; const isTask=d.type==="task"; const n=d.dates.size;
  const custom=d.color&&!COLORS.some(c=>c.h.toLowerCase()===d.color.toLowerCase());
  return `<div style="display:grid;gap:12px">
  <div class="sbar"><button class="btn ghost" type="button" data-act="cancel">‹ 戻る</button><h2>${d.editId?"予定を直す":"予定を入れる"}</h2><button class="btn primary" type="button" data-act="save">保存</button></div>
  ${d.isRep?`<section class="card"><span class="lbl">直す範囲（くり返しの予定です）</span><div class="seg" role="group" aria-label="直す範囲"><button type="button" data-scope="one" aria-pressed="${d.scope==="one"}">${md(d.occ)}の回だけ</button><button type="button" data-scope="all" aria-pressed="${d.scope==="all"}">すべての回</button></div></section>`:""}
  <div class="seg" role="group" aria-label="予定かタスクか"><button type="button" data-dtype="event" aria-pressed="${!isTask}">予定</button><button type="button" data-dtype="task" aria-pressed="${isTask}">タスク</button></div>
  <input class="title-in" type="text" id="d-title" data-d="title" value="${esc(d.title)}" placeholder="${isTask?"やることを入力":"タイトル（空なら種類の名前）"}" aria-label="タイトル">
  <section class="card">
    <label class="switch-row" for="d-allDay"><span>終日</span><span class="switch"><input type="checkbox" role="switch" id="d-allDay" data-d="allDay" ${d.allDay?"checked":""}><span></span></span></label>
    ${d.allDay&&!isTask?`<div class="row"><label for="d-endDate" class="lbl">終わりの日</label><input type="date" id="d-endDate" data-d="endDate" value="${d.endDate||""}" min="${[...d.dates].sort()[0]||""}"></div><p class="hint">旅行など何日も続く予定は、下で始まりの日を1つ選び、ここで終わりの日を選ぶと1つの予定になります。1日だけなら空のままにします。</p>`:""}
    ${d.allDay?"":isTask?`<div class="row"><label for="d-start" class="lbl">時刻</label><input type="time" id="d-start" data-d="start" value="${d.start}"></div>`
      :`<div class="row trow"><input type="time" id="d-start" data-d="start" value="${d.start}" aria-label="開始"> 〜 <input type="time" id="d-end" data-d="end" value="${d.end}" aria-label="終了"></div><p class="hint">終わりが始まりより早いときは、次の日の朝までとして計算します（夜勤など）。</p>`}
  </section>
  <section class="card">
    <div class="row" style="justify-content:space-between"><span class="lbl">日にち${d.editId?"":"（いくつでも選べます）"}</span><span class="row" style="flex-wrap:nowrap"><button class="icon-btn" type="button" data-act="mprev" aria-label="前の月">‹</button><b class="num">${d.my}年${d.mm+1}月</b><button class="icon-btn" type="button" data-act="mnext" aria-label="次の月">›</button></span></div>
    <div class="mini" id="mini">${miniCal(d)}</div>
    <p class="picked">${n?[...d.dates].sort().map(md).join("、")+`（${n}日）`:"日にちを選んでください"}</p>
    ${d.editId?`<p class="hint">ほかの日もタップすると、同じ内容をその日にも入れられます。</p>`:`<p class="hint">タップするか指でなぞると、何日でもまとめて選べます。もう一度タップすると外れます。</p>
    <div class="row"><span class="hint">曜日でまとめて選ぶ：</span><div class="wkrow">${WD.map((w,i)=>`<button type="button" data-wk="${i}" aria-label="${d.mm+1}月の毎週${w}曜日">${w}</button>`).join("")}</div></div>
    <div class="row"><button type="button" class="small" data-act="clear" ${n?"":"disabled"}>選んだ日をクリア</button></div>`}
  </section>
  ${d.isRep&&d.scope==="one"?"":`<section class="card"><label for="d-repeat" class="lbl">くり返し</label>
    <select id="d-repeat" data-d="repeat">${[["","しない"],["day","毎日"],["week","毎週"],["month","毎月"],["year","毎年"]].map(([v,l])=>`<option value="${v}" ${d.repeat===v?"selected":""}>${l}</option>`).join("")}</select>
    ${d.repeat?`<p class="hint">${repeatLabel({repeat:{freq:d.repeat,interval:d.repeat===d.origFreq?d.interval:1},date:[...d.dates].sort()[0]||TODAY})}${n>1?"。選んだ日それぞれがくり返します":""}</p>
    <div class="row"><label for="d-until" class="lbl">終わりの日</label><input type="date" id="d-until" data-d="until" value="${d.until||""}"></div><p class="hint">空ならずっと続きます。</p>`:""}
  </section>`}
  <section class="card">
    <span class="lbl">種類（色）</span>${catButtons(d.cat)}
    <details ${d.color?"open":""}><summary class="hint" style="cursor:pointer">この予定だけ色を変える</summary>
      <div class="sw" style="margin-top:10px" role="group" aria-label="この予定の色"><button type="button" class="def" data-dcolor="" aria-pressed="${!d.color}">種類の色</button>${COLORS.map(c=>`<button type="button" style="--cc:${c.h}" title="${c.n}" aria-label="${c.n}" data-dcolor="${c.h}" aria-pressed="${d.color===c.h}"></button>`).join("")}<label class="custom${custom?" on":""}" style="--cc:${d.color||GRAY}" title="自分で色を選ぶ"><input type="color" id="d-custom" data-dcustom value="${(d.color||GRAY).toLowerCase()}" aria-label="自分で色を選ぶ"><span aria-hidden="true">＋</span></label></div>
    </details>
  </section>
  <section class="card"><label for="d-place" class="lbl">場所</label><input type="text" id="d-place" data-d="place" value="${esc(d.place||"")}" placeholder="例：駅前店、〇〇ホール" style="width:100%"><label for="d-memo" class="lbl">メモ</label><textarea id="d-memo" data-d="memo" placeholder="例：持ち物、集合場所、連絡先など" style="min-height:96px">${esc(d.memo||"")}</textarea>${n>1&&!d.editId?`<p class="hint">選んだ${n}日すべてに同じメモが入ります。</p>`:""}</section>
  ${d.editId?`<button type="button" class="btn danger" data-act="delete">${d.isRep?(d.scope==="one"?`${md(d.occ)}の回だけ消す`:"すべての回を消す"):`この${isTask?"タスク":"予定"}を消す`}</button>`:`
  <details class="card" id="textbox" ${d.textOpen?"open":""}><summary>紙のカレンダーを見ながら文字でまとめて入れる</summary>
    <p class="hint">「日にち 時間」を1行ずつ書くと、${d.mm+1}月の予定としてまとめて入ります。種類と色は上で選んだものになります。</p>
    <textarea id="d-text" data-d="text" placeholder="例：&#10;1 勝 9-14&#10;5 勝 11:30-17&#10;8日 11時〜17時&#10;28 松 9-17">${esc(d.text||"")}</textarea>
    <div class="row"><label for="d-mark" class="lbl">印や名前で絞り込む</label><input type="text" id="d-mark" data-d="mark" value="${esc(d.mark||"")}" placeholder="例：勝" style="width:8em"></div>
    <p class="hint">家族で1枚のカレンダーを使っているとき、自分の印の行だけを入れられます。空なら全部入ります。</p>
    <ul class="preview" id="preview"></ul>
    <button type="button" class="btn primary" id="text-save" data-act="textsave" disabled>読み取った予定を入れる</button>
  </details>`}
  </div>`;
}

function renderPay(){
  const t=monthTotals();
  return `<div style="display:grid;gap:14px">${monthHead()}
  <section class="card" id="pay-sum">${paySummary(t)}</section>
  <section class="card"><h3>この月の勤務</h3><div id="pay-list" style="display:grid;gap:10px">${payList(monthShifts())}</div></section>
  <h3>給料の計算方法</h3>
  <p class="note">時給や計算のしかたを自分で決められます。変えるとすぐ上の金額に反映されます。</p>
  ${t.wps.map(wageCard).join("")}
  <section class="card"><h3>手取りの目安</h3>
    <label class="check"><input type="checkbox" id="showTake" ${state.showTake?"checked":""}>月の手取り目安を表示する</label>
    <p class="note">所得税をおおまかに引いた金額です（月88,000円未満は0円として計算）。実際の金額は給与明細で確認してください。</p></section>
  <div class="row"><button type="button" class="btn" data-act="addwp">＋ 働く場所を追加</button></div></div>`;
}
function paySummary(t){
  return `<div class="sum-grid">
    <div class="sum-item"><span class="l">給料の見込み</span><span class="v">${yen(t.pay)}</span></div>
    <div class="sum-item"><span class="l">交通費（給料とは別）</span><span class="v">${yen(t.travel)}</span></div>
    <div class="sum-item total"><span class="l">合計</span><span class="v">${yen(t.pay+t.travel)}</span></div>
    ${state.showTake?`<div class="sum-item"><span class="l">給料の手取り目安</span><span class="v">${yen(t.pay-t.tax)}</span></div>`:""}</div>
    <div class="row hint">${t.wps.map(w=>{const p=t.per[w.id];return `<span class="row" style="${cv(w.color)};gap:6px"><i class="dot"></i>${esc(w.name)}：${p.days.size}日・給料 ${yen(p.pay)}・交通費 ${yen(p.travel)}</span>`}).join("")}</div>`;
}
function payList(shifts){
  if(!shifts.length) return `<p class="empty">この月の仕事の予定はまだありません。「給料を計算する」にした種類で時間つきの予定を入れると、ここに出ます。</p>`;
  return shifts.map(e=>{const w=catOf(e.cat),r=shiftPay(e,w);
    const det=[`働いた時間 ${hm(r.worked)}`,`時給 ${yen(r.base)}${r.why?`（${r.why}）`:""}`];
    if(r.brk) det.push(`休憩 ${r.brk}分を引く`); if(r.nightPay) det.push(`深夜割増 +${yen(r.nightPay)}`); if(r.otPay) det.push(`残業割増 +${yen(r.otPay)}`); if(r.earlyPay) det.push(`早朝 +${yen(r.earlyPay)}`);
    return `<div class="shift" style="${cv(colorOf(e))}"><div class="shift-top"><div><b class="num">${md(e.date)}（${WD[new Date(e.date+"T00:00").getDay()]}）${esc(w.name)}</b><div class="hint num">${e.start}〜${e.end}</div></div><span class="amt">${yen(r.pay)}</span></div><div class="det">${det.map(x=>`<span>${x}</span>`).join("")}</div></div>`;}).join("");
}
function wageCard(w){
  const f=(k,label,suf)=>`<div class="row"><label for="${w.id}-${k}">${label}</label><input type="number" id="${w.id}-${k}" data-cat="${w.id}" data-k="${k}" value="${w[k]}" min="0">${suf}</div>`;
  const chk=(k,label)=>`<label class="check"><input type="checkbox" id="${w.id}-${k}" data-cat="${w.id}" data-k="${k}" ${w[k]?"checked":""}>${label}</label>`;
  return `<section class="card wp" style="${cv(w.color)}">
    <input type="text" id="${w.id}-pname" data-cat="${w.id}" data-k="name" value="${esc(w.name)}" aria-label="働く場所の名前" style="font-weight:700;font-size:1.15rem;max-width:16em">
    <div class="wp-grid">
      <div class="opt"><h4>時給</h4>${f("wage","はじめの時給","円")}${f("weekendPlus","土日の上乗せ","円")}${f("earlyPlus","早朝（5〜8時）の上乗せ","円")}</div>
      <div class="opt"><h4>昇給の記録</h4>${(w.raises||[]).slice().sort((a,b)=>a.from.localeCompare(b.from)).map(r=>`<div class="row"><input type="date" id="${w.id}-${r.id}-from" data-raise="${w.id}" data-rid="${r.id}" data-rk="from" value="${r.from}" aria-label="昇給した日">から<input type="number" id="${w.id}-${r.id}-wage" data-raise="${w.id}" data-rid="${r.id}" data-rk="wage" value="${r.wage}" min="0" aria-label="新しい時給">円<button type="button" class="small" data-delraise="${w.id}" data-rid="${r.id}">消す</button></div>`).join("")}
        <div class="row"><button type="button" class="small" data-addraise="${w.id}">＋ 昇給を記録する</button></div>
        <p class="hint">昇給した日より前の勤務は前の時給、その日からは新しい時給で計算します。何回でも記録できます。</p></div>
      <div class="opt"><h4>時間の切り方</h4>
        <div class="row"><label for="${w.id}-unit">単位</label><select id="${w.id}-unit" data-cat="${w.id}" data-k="unit">${[1,15,30].map(u=>`<option value="${u}" ${+w.unit===u?"selected":""}>${u}分</option>`).join("")}</select>
        <select id="${w.id}-dir" data-cat="${w.id}" data-k="dir" aria-label="端数"><option value="floor" ${w.dir==="floor"?"selected":""}>切り捨て</option><option value="ceil" ${w.dir==="ceil"?"selected":""}>切り上げ</option></select></div>
        </div>
      <div class="opt"><h4>休憩</h4>${chk("autoBreak","休憩を自動で引く")}
        ${(w.breaks||(w.breaks=defaultBreaks())).map((r,i)=>`<div class="row"><input type="number" id="${w.id}-brk${i}-over" data-brk="${w.id}" data-bi="${i}" data-bk="over" value="${r.over}" min="0" step="0.5" style="width:4.2em" aria-label="何時間を超えたら">時間を超えたら<input type="number" id="${w.id}-brk${i}-min" data-brk="${w.id}" data-bi="${i}" data-bk="min" value="${r.min}" min="0" step="5" style="width:4.2em" aria-label="何分の休憩">分<button type="button" class="small" data-delbrk="${w.id}" data-bi="${i}">消す</button></div>`).join("")}
        <div class="row"><button type="button" class="small" data-addbrk="${w.id}">＋ ルールを追加</button></div>
        <p class="hint">勤務時間が長いほど、当てはまるいちばん長い休憩が引かれます。</p></div>
      <div class="opt"><h4>割増</h4>${chk("nightOn","深夜割増")}
        <div class="row"><input type="time" id="${w.id}-nightStart" data-cat="${w.id}" data-k="nightStart" value="${w.nightStart||"22:00"}" aria-label="深夜割増が始まる時刻">〜<input type="time" id="${w.id}-nightEnd" data-cat="${w.id}" data-k="nightEnd" value="${w.nightEnd||"05:00"}" aria-label="深夜割増が終わる時刻"></div>
        <p class="hint">この時間に働いた分が割増になります。職場に合わせて変えてください。</p>${f("nightPct","増える割合","%")}${chk("otOn","残業（1日8時間を超えた分）")}${f("otPct","増える割合","%")}</div>
      <div class="opt"><h4>祝日・年末年始</h4>${chk("holOn","この日だけ時給を変える")}${f("holWage","その日の時給","円")}</div>
      <div class="opt"><h4>交通費（給料とは別）</h4>
        <div class="row"><label for="${w.id}-travel">払われ方</label><select id="${w.id}-travel" data-cat="${w.id}" data-k="travel"><option value="none" ${w.travel==="none"?"selected":""}>なし</option><option value="day" ${w.travel==="day"?"selected":""}>出勤1日ごと</option><option value="pass" ${w.travel==="pass"?"selected":""}>定期代（月ごと）</option></select></div>
        ${f("travelAmt",w.travel==="pass"?"月の金額":"1日の金額","円")}</div>
    </div></section>`;
}

  return `<div style="display:grid;gap:14px">
  <section class="card"><h3>文字の大きさ</h3>
    <div class="seg" role="group" aria-label="文字の大きさ" style="margin-top:10px">${[["m","標準"],["l","大きめ"],["xl","特大"]].map(([v,l])=>`<button type="button" data-fs="${v}" aria-pressed="${(state.fs||"m")===v}">${l}</button>`).join("")}</div>
    <p class="note">カレンダーや予定の文字が、すべてこの大きさになります。</p></section>
  <section class="card"><h3>何色を何の予定にするか</h3>
    <p class="note">色ごとに、どんな予定に使うかを自分で決められます。たとえば「オレンジ＝仕事系」「緑＝遊び系」のように名前を付けてください。仕事の種類は「給料を計算する」をオンにすると、給料の画面に出ます。</p></section>
  ${state.cats.map(c=>{const custom=!COLORS.some(x=>x.h.toLowerCase()===c.color.toLowerCase());const used=state.events.filter(e=>e.cat===c.id).length;

function impCatFor(name){

  return (hit||state.cats.find(c=>!c.pay)||state.cats[0]).id;
}
// 名前に種類の名前が入っていれば、その種類にする（例：「バイト（駅前）」→ バイト）
const impTitleCat=t=>{const hit=state.cats.find(c=>c.name&&c.name.length>=2&&t.includes(c.name));return hit&&hit.id;};
function impBuild(){
  const im=state.imp, have=new Map(), groups=new Map(), was={};
  state.events.forEach(e=>{if(e.ics) have.set(e.ics,e);});
  const list=im.cals.map(c=>{const evs=[], dups=[];
    icsToEvents(c,im.range).forEach(e=>{const o=have.get(e.ics); if(o&&!was[e.title]) was[e.title]=o.cat; (o?dups:evs).push(e); const g=groups.get(e.title)||{n:0,cal:c}; g.n++; groups.set(e.title,g);});
    return {c,evs,dups};});
  const titles=[...groups].sort((a,b)=>b[1].n-a[1].n||a[0].localeCompare(b[0],"ja")).map(([t,g])=>({t,n:g.n,cat:(im.titles||{})[t]||(catOf(was[t])&&was[t])||impTitleCat(t)||g.cal.cat}));
  return {list,titles,catOfTitle:Object.fromEntries(titles.map(x=>[x.t,x.cat])),have,dup:list.reduce((s,x)=>s+x.dups.length,0),total:list.reduce((s,x)=>s+x.evs.length,0)};
}
function renderImport(){

  const dot=id=>`<i class="dot" style="${cv((catOf(id)||{color:GRAY}).color)}" aria-hidden="true"></i>`;
  const seen={}, dupName=n=>im.cals.filter(c=>c.name===n).length>1;

    ${r.list.map((x,i)=>{const nm=dupName(x.c.name)?`${x.c.name}（${seen[x.c.name]=(seen[x.c.name]||0)+1}つ目）`:x.c.name, ex=[...new Set([...x.evs,...x.dups].map(e=>e.title))].slice(0,3).join("、");

      <p class="note">Googleカレンダーの書き出しファイルには、予定の色が入っていません。そのかわり、ここで予定の名前ごとに種類（色）を選べます。同じ名前の予定は、まとめてその色になります。</p>
      <ul class="tlist">${r.titles.map((x,i)=>`<li><div class="tname-row"><span class="tname">${esc(x.t)}</span><span class="tcount">${x.n}件</span></div><div class="row isel">${dot(x.cat)}<select data-imptitle="${i}" aria-label="「${esc(x.t)}」の種類">${opts(x.cat)}</select></div></li>`).join("")}</ul>

    <div class="imp-row"><label for="imp-range" class="lbl">いつからの予定を移すか</label><select id="imp-range">${[["1y","1年前から"],["now","今日から"],["all","すべて"]].map(([v,l])=>`<option value="${v}" ${im.range===v?"selected":""}>${l}</option>`).join("")}</select></div>
